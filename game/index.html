<title>VOIDFALL — Neon Arena Survival</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050210; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { width: min(100vw, calc(100vh * 1.6)); aspect-ratio: 8 / 5; }
  canvas {
    display: block; width: 100%; height: 100%;
    background: #0b0620; cursor: crosshair;
    border: 1px solid #2a1a5e;
  }
  #fallback { position: absolute; color: #f2ecff; top: 12px; left: 12px; font-size: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<div id="fallback"></div>
